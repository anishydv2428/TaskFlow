<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow | Task Management</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <nav class="navbar">
      <div class="logo"><span>✓</span> TaskFlow</div>

      <div class="nav-right">
        <div class="avatar">A</div>
      </div>
    </nav>

    <main class="container">
      <section class="hero">
        <div>
          <p class="welcome">WORKSPACE</p>
          <h1>Manage your tasks.<br /><span>Get things done.</span></h1>
          <p class="subtitle">
            Organize your work, track progress and stay productive.
          </p>
        </div>

        <button class="add-btn" onclick="openModal()">+ New Task</button>
      </section>

      <!-- Progress -->
      <section class="progress-section">
        <div class="progress-header">
          <h2>Overall Progress</h2>
          <span id="progressPercent">0%</span>
        </div>

        <div class="progress-bar">
          <div id="progressFill"></div>
        </div>
      </section>

      <!-- Statistics -->

      <section class="stats">
        <div class="stat-card">
          <div class="stat-icon">📋</div>
          <div>
            <p>Total Tasks</p>
            <h2 id="totalTasks">0</h2>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">⏳</div>
          <div>
            <p>Pending</p>
            <h2 id="pendingTasks">0</h2>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">⚡</div>
          <div>
            <p>In Progress</p>
            <h2 id="progressTasks">0</h2>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">✓</div>
          <div>
            <p>Completed</p>
            <h2 id="completedTasks">0</h2>
          </div>
        </div>
      </section>

      <!-- Controls -->

      <section class="controls">
        <div class="search-box">
          🔍
          <input
            type="text"
            id="searchInput"
            placeholder="Search tasks..."
            oninput="renderTasks()"
          />
        </div>

        <select id="filterStatus" onchange="renderTasks()">
          <option value="all">All Status</option>
          <option value="pending">Pending</option>
          <option value="in-progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>

        <select id="filterPriority" onchange="renderTasks()">
          <option value="all">All Priorities</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </section>

      <!-- Tasks -->

      <section class="tasks-section">
        <div class="section-header">
          <h2>Your Tasks</h2>
          <span id="taskCount">0 tasks</span>
        </div>

        <div id="taskList"></div>
      </section>
    </main>

    <!-- Modal -->

    <div class="modal" id="taskModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Create New Task</h2>
          <button onclick="closeModal()">×</button>
        </div>

        <form id="taskForm">
          <label>Task Title</label>
          <input
            type="text"
            id="taskTitle"
            placeholder="e.g. Build portfolio"
            required
          />

          <label>Description</label>
          <textarea
            id="taskDescription"
            placeholder="Describe your task..."
          ></textarea>

          <label>Priority</label>
          <select id="taskPriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>

          <button type="submit" class="submit-btn">Create Task</button>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
